# SSH-tunnel-only staging. Both listeners are loopback; do not expose 8080/8001.
server {
    listen 127.0.0.1:8080;
    server_name app.preview.localhost;
    root /opt/atoms-demo/current/frontend/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }
    location = /healthz {
        proxy_pass http://127.0.0.1:8000;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 127.0.0.1:8001;
    server_name _;
    access_log off;
    error_log /dev/null crit;
    location / {
        proxy_pass http://127.0.0.1:8132;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }
}
