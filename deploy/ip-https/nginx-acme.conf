# Keep this listener for six-day IP certificate renewals.
server {
    listen 172.19.36.105:80;
    server_name 8.137.197.104;
    access_log off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/atoms-demo-ip-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / { return 404; }
}
