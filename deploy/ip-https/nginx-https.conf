# Additive TLS listeners. The existing HTTP listeners stay in place until cutover.
server {
    listen 172.19.36.105:443 ssl;
    server_name 8.137.197.104;
    ssl_certificate /etc/letsencrypt/live/8.137.197.104/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/8.137.197.104/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    access_log off;
    add_header Referrer-Policy no-referrer always;

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }
}

# Preview tickets are bearer URLs. Never write their paths to access/error logs.
server {
    listen 172.19.36.105:18443 ssl;
    server_name 8.137.197.104;
    ssl_certificate /etc/letsencrypt/live/8.137.197.104/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/8.137.197.104/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    access_log off;
    error_log /dev/null crit;
    client_max_body_size 1m;
    add_header Referrer-Policy no-referrer always;

    location / {
        proxy_pass http://127.0.0.1:18001;
        proxy_set_header Host $http_host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }
}
