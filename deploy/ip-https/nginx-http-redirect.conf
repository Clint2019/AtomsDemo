# Replace the old HTTP proxy only after the application switches to HTTPS origins.
server {
    listen 172.19.36.105:18080;
    server_name 8.137.197.104;
    access_log off;
    return 308 https://8.137.197.104$request_uri;
}

server {
    listen 172.19.36.105:18001;
    server_name 8.137.197.104;
    access_log off;
    error_log /dev/null crit;
    return 308 https://8.137.197.104:18443$request_uri;
}
