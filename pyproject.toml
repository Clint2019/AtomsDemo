[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atoms-demo"
version = "0.0.0"
description = "Modular application platform under staged implementation"
requires-python = ">=3.11"
dependencies = ["cryptography>=42,<47", "Pillow>=10,<13"]

[tool.setuptools.packages.find]
include = ["atoms_demo*"]
